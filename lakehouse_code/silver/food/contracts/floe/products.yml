    - { name: "energy_kcal_100g", type: "float64" }
    - { name: "sugars_100g", type: "float64" }
    - { name: "salt_100g", type: "float64" }
    - { name: "last_modified_t", type: "int64", nullable: false }
    - { name: "last_modified_at", type: "datetime", nullable: false }
