version: "0.8"

metadata:
  project: "acme"
  description: "Bronze to Silver Floe contracts for every ACME domain."

# Storages and catalogs are stage bindings: the EnvironmentProfile the
# project-code runtime renders for its stage supplies both.
report:
  path: "floe/reports"
  storage: "openlakeforge_ops"

include:
  sources: "sources.yml"
  domains:
    - "*/contracts/floe/_domain.yml"
