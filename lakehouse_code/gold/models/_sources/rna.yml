version: 2

sources:
  - name: rna
    database: "{{ env_var('OPENLAKEFORGE_CATALOG_NAME') }}"
    schema: "{{ env_var('OPENLAKEFORGE_CATALOG_SCHEMA_PREFIX', '') }}rna_silver"
    description: The rna domain's Floe-owned Silver Iceberg tables.
    tables:
      - name: sequences
        description: Validated RNAcentral sequences, merged on URS.
      - name: expert_databases
        description: Validated RNAcentral expert databases.
