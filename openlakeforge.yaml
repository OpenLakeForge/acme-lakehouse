apiVersion: openlakeforge.io/v1beta1
kind: DeploymentProfile

metadata:
  name: acme-lakehouse

spec:
  provider:
    type: local
  preset: slim
  project:
    repository: https://github.com/OpenLakeForge/acme-lakehouse
    image:
      repository: ghcr.io/openlakeforge/acme-lakehouse-code
  # DEV and PROD read different Open Food Facts servers through their own
  # source bindings; see README.md.
  # Run pods reach the sources' hosts on these ports only: Open Food Facts
  # over HTTPS, RNAcentral's public PostgreSQL.
  stages:
    dev:
      enabled: true
      source_egress:
        ports: [443, 5432]
    prod:
      enabled: true
      source_egress:
        ports: [443, 5432]
  access:
    tls: none
