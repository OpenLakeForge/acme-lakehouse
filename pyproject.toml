[project]
name = "acme-lakehouse"
version = "0.1.0"
description = "A customer-style OpenLakeForge project loading public food and RNA data incrementally."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  # The OpenLakeForge release this project targets. Keep the three versions equal.
  "openlakeforge==0.6.0a2",
  "openlakeforge-core==0.6.0a2",
  "openlakeforge-runtime==0.6.0a2",
  # The connectors' own dependency set, as the project-code image installs it.
  "dlt[parquet]==1.29.0",
  "boto3",
  "psycopg2-binary",
  "sqlalchemy>=2",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "lakehouse_code"]
