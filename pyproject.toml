[project]
name = "acme-lakehouse"
version = "0.1.0"
description = "A customer-style OpenLakeForge project loading public food and RNA data incrementally."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "openlakeforge",
  "openlakeforge-core",
  "openlakeforge-runtime",
  # The connectors' own dependency set, as the project-code image installs it.
  "dlt[parquet]==1.29.0",
  "boto3",
  "psycopg2-binary",
  "sqlalchemy>=2",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false

# Pinned to an exact platform commit until openlakeforge-runtime ships in a
# published release; then pin the PyPI versions instead. Keep the three revs equal.
# Currently openlakeforge main (7484c17, the unreleased v0.6 descriptor formats:
# governance.yml v1beta2, source.yaml v1beta1, spec.access.tls).
[tool.uv.sources]
openlakeforge = { git = "https://github.com/OpenLakeForge/openlakeforge", rev = "7484c17c405380820a8aa7cc77e7eef425c55e7c", subdirectory = "tools/olf" }
openlakeforge-core = { git = "https://github.com/OpenLakeForge/openlakeforge", rev = "7484c17c405380820a8aa7cc77e7eef425c55e7c", subdirectory = "packages/core" }
openlakeforge-runtime = { git = "https://github.com/OpenLakeForge/openlakeforge", rev = "7484c17c405380820a8aa7cc77e7eef425c55e7c", subdirectory = "packages/runtime" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "lakehouse_code"]
